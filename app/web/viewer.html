<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原文 · 型月搜索</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page viewer">
  <div class="viewer-bar">
    <a class="back" href="javascript:history.length>1?history.back():window.close()">← 返回搜索结果</a>
    <span class="nav">
      <button id="prev" type="button">上一处</button>
      <span id="counter">–</span>
      <button id="next" type="button">下一处</button>
    </span>
    <label class="jp-toggle hidden" id="jp-label">
      <input type="checkbox" id="jp-show"> 显示未翻译的日文段
    </label>
  </div>

  <header class="doc-head">
    <h1 id="doc-title">读取中…</h1>
    <div id="doc-meta" class="doc-meta"></div>
  </header>

  <div id="doc-body" class="doc-body"></div>
  <footer id="doc-foot" class="status"></footer>
</div>
<script src="viewer.js"></script>
</body>
</html>
