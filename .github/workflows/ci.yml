name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python syntax check
        run: python -m compileall -q app tools tests scripts
      - name: Frontend render tests
        run: node --test tests/test_render.mjs
      - name: Data integration tests
        if: ${{ hashFiles('data/entries.json') != '' }}
        run: python -m unittest discover -s tests -v
