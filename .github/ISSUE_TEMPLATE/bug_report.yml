name: Bug 报告
description: 报告桌面版、手机版或网页功能异常
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: 使用平台
      options:
        - 桌面免安装版
        - Android APK
        - 源码运行
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本号
      placeholder: v1.1.7
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序说明如何触发问题
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图或日志
      description: 不要上传完整 data、签名密钥或个人信息
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已确认问题可以复现
          required: true
        - label: 我没有上传签名密钥或完整私有数据
          required: true
